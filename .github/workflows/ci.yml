name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:

  # The crate declares a minimum supported Rust version; a dependency bump or a
  # newly used language feature can quietly break it, because every other job
  # runs on stable.  This is the check that caught `ignore` pulling in
  # let-chains and two crates whose own sources had outgrown their declared
  # MSRV.  The toolchain is derived from rust-version in Cargo.toml rather than
  # pinned here: a hand-written pin that drifts below the declared MSRV makes
  # `cargo check --locked` a hard error, which is how six repositories in this
  # suite sat red on every push.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the declared MSRV from Cargo.toml
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' Cargo.toml)"
          test -n "$version" || { echo "Cargo.toml declares no rust-version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV: $version"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build on the declared minimum supported Rust
        run: cargo check --all-targets --locked
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build data
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --locked --all-targets

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Build release daemon
        run: cargo build --release --locked

      - name: Verify installer
        run: |
          ./install.sh
          test -s lib/simplecc-daemon
          test -x lib/simplecc-daemon
          cmp -s target/release/simplecc-daemon lib/simplecc-daemon

  vim:
    name: Vim9
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Vim
        run: |
          sudo apt-get update
          sudo apt-get install --yes vim-nox
          vim --version

      - name: Compile Vim9 scripts and help
        run: |
          vim -Nu NONE -n -i NONE -es \
            -c 'let g:simplecc_auto_start=0' \
            -c "set rtp^=$GITHUB_WORKSPACE" \
            -c 'runtime plugin/simplecc.vim' \
            -c 'source autoload/simplecc.vim' \
            -c 'defcompile' \
            -c 'helptags doc' \
            -c 'qa!'

      # One target, not a hand-written list: `make vim-check` is the Makefile's
      # own definition of the Vim half of `make check`, so a new test file is
      # wired up in one place instead of two that drift apart.
      - name: Vim9 checks (defcompile, supervisor suite, smoke tests)
        run: make vim-check
